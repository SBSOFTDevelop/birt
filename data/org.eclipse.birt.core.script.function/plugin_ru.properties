#Properties file for org.eclipse.birt.core.script.bre
Bundle-Name.0 = Скриптовые функции
dataType.String=String
dataType.Any=Any
dataType.DateTime=DateTime
dataType.Integer=Integer
dataType.Double=Double
dataType.Number=Number
dataType.Boolean=Boolean
dataType.DoubleArray=Double[]

FunctionDesc.charLength=Возвращает количество символов в строке.
FunctionDesc.concat=Возвращает строку, полученную конкатенацией всех заданных строк.
FunctionDesc.indexOf=Выполняет поиск target в строке source и возвращает индекс первого вхождения pattern.\nПоиск начинается с позиции start. Все индексы начинаются с 0.\nЕсли start опущен, предполагается значение 0.\nПоиск в строке чувствителен к регистру.
FunctionDesc.left=Возвращает первые n символов строки str.\nЕсли n равно 0, возвращается пустая строка.\nЕсли n больше длины str, возвращается вся строка.\nЕсли n опущен, используется значение 1.
FunctionDesc.right=Возвращает последние n символов строки str.\nЕсли n равно 0, возвращается пустая строка. Если n больше длины str, возвращается вся строка.\nЕсли n опущен, используется значение 1.
FunctionDesc.search=Аналогично функции indexOf, за исключением того, что:\n(1) сравнение строк нечувствительно к регистру\n(2) строка pattern может содержать подстановочные символы:\n* соответствует любой последовательности символов (включая пустую);\n? соответствует любому одиночному символу.
FunctionDesc.toLower=Преобразует все символы в строке source к нижнему регистру.
FunctionDesc.toUpper=Преобразует все символы в строке source к верхнему регистру.
FunctionDesc.trim=Удаляет все ведущие и замыкающие пробельные символы (пробел, TAB и т.д.).\nТакже все последовательные пробельные символы объединяются в один.
FunctionDesc.trimLeft=Удаляет все ведущие пробелы. Замыкающие пробелы и пробелы между словами не удаляются.
FunctionDesc.trimRight=Удаляет все замыкающие пробелы. Ведущие пробелы и пробелы между словами не удаляются.
FunctionDesc.anyOf=source входит в диапазон target
FunctionDesc.between=TRUE, если source находится между target1 и target2. В противном случае FALSE
FunctionDesc.notBetween=TRUE, если source не находится между target1 и target2. В противном случае FALSE
FunctionDesc.equalTo=source равно target
FunctionDesc.greaterThan=source больше target
FunctionDesc.lessThan=source меньше target
FunctionDesc.greaterOrEqual=source больше или равно target
FunctionDesc.lessOrEqual=source меньше или равно target
FunctionDesc.notEqual=source не равно target
FunctionDesc.like=source соответствует шаблону SQL target
FunctionDesc.notLike=source не соответствует шаблону SQL target
FunctionDesc.match=source соответствует шаблону Javascript target
FunctionDesc.compareString=Сравнивает две строки по заданным условиям
FunctionDesc.add=Сумма двух чисел n1 и n2.
FunctionDesc.substract=n1 минус n2
FunctionDesc.multiple=n1 умножить на n2. Эта функция используется только для обратной совместимости с функцией "multiply".
FunctionDesc.multiply=n1 умножить на n2
FunctionDesc.divide=делимое делится на делитель
FunctionDesc.round=Округляет число до заданного количества знаков.\ndec — целое число и может быть отрицательным.\nЗначение dec по умолчанию равно 0, если опущено.
FunctionDesc.roundUp=Округляет число вверх, от 0, до заданного количества знаков.\nЗначение dec по умолчанию равно 0.
FunctionDesc.roundDown=Округляет число вниз, к 0, до заданного количества знаков.\nЗначение dec по умолчанию равно 0.
FunctionDesc.ceiling=Округляет число вверх, от 0, до ближайшего кратного значению significance.
FunctionDesc.mod=Остаток от деления number на divisor. Результат имеет тот же знак, что и делитель.
FunctionDesc.safeDivide=Если результат деления делимого на делитель не равен нулю или бесконечности, возвращает результат.\nВ противном случае возвращает заданное значение if Zero.
FunctionDesc.year=4-значный номер года для заданного значения даты/времени
FunctionDesc.quarter=Номер квартала (от 1 до 4) для заданного значения даты/времени
FunctionDesc.month=Месяц значения даты/времени. Option — целое число:\n1 (по умолчанию): возвращает номер месяца (1-12);\n2: возвращает полное название месяца согласно локали пользователя (например, January–December для английской локали);\n3: возвращает сокращённое название месяца согласно локали пользователя (например, Jan–Dec для английской локали)
FunctionDesc.week=Номер недели в году (от 1 до 52) для значения даты/времени d.
FunctionDesc.hour=Час значения даты/времени.
FunctionDesc.minute=Минута значения даты/времени.
FunctionDesc.second=Секунда значения даты/времени.
FunctionDesc.weekOfMonth=Номер недели в месяце для значения даты/времени d (от 1 до 6).
FunctionDesc.weekOfQuarter=Номер недели в квартале для значения даты/времени d (от 1 до 15).
FunctionDesc.weekOfYear=Номер недели в году для значения даты/времени d (от 1 до 52).
FunctionDesc.day=Номер дня в месяце (от 1 до 31).
FunctionDesc.weekDay=День недели. Option — целое число:\n1: возвращает число от 1 (воскресенье) до 7 (суббота);\n2: возвращает число от 1 (понедельник) до 7 (воскресенье);\n3: возвращает число от 0 (понедельник) до 6 (воскресенье);\n4: возвращает название дня недели согласно локали пользователя (например, Sunday–Saturday для английского);\n5: возвращает сокращённое название дня недели согласно локали пользователя (например, Sun–Sat для английского)
FunctionDesc.dayOfWeek=Номер дня в неделе (от 1 до 7).
FunctionDesc.dayOfYear=Номер дня в году (от 1 до 366).
FunctionDesc.dayOfQuarter=Номер дня в квартале (от 1 до 92).
FunctionDesc.dayOfMonth=Номер дня в месяце (от 1 до 31).
FunctionDesc.today=Возвращает значение timestamp, соответствующее полуночи текущей даты.
FunctionDesc.now=Возвращает текущее значение timestamp.
FunctionDesc.diffYear=Возвращает разницу в количестве лет.
FunctionDesc.diffMonth=Возвращает разницу в количестве месяцев.
FunctionDesc.diffQuarter=Возвращает разницу в количестве кварталов.
FunctionDesc.diffWeek=Возвращает разницу в количестве недель.
FunctionDesc.diffDay=Возвращает разницу в количестве дней.
FunctionDesc.diffHour=Возвращает разницу в количестве часов.
FunctionDesc.diffMinute=Возвращает разницу в количестве минут.
FunctionDesc.diffSecond=Возвращает разницу в количестве секунд.
FunctionDesc.addYear=Добавляет n лет к дате.
FunctionDesc.addMonth=Добавляет n месяцев к дате.
FunctionDesc.addQuarter=Добавляет n кварталов к дате.
FunctionDesc.addWeek=Добавляет n недель к дате.
FunctionDesc.addDay=Добавляет n дней к дате.
FunctionDesc.addHour=Добавляет n часов к дате.
FunctionDesc.addMinute=Добавляет n минут к дате.
FunctionDesc.addSecond=Добавляет n секунд к дате.
FunctionDesc.firstDayOfYear=Возвращает первый день года, в который попадает дата.
FunctionDesc.firstDayOfQuarter=Возвращает первый день квартала, в который попадает дата.
FunctionDesc.firstDayOfMonth=Возвращает первый день месяца, в который попадает дата.
FunctionDesc.firstDayOfWeek=Возвращает первый день недели, в который попадает дата.
FunctionDesc.fiscalYear=Возвращает финансовый год для заданной даты.
FunctionDesc.fiscalQuarter=Возвращает квартал финансового года для заданной даты.
FunctionDesc.fiscalMonth=Возвращает месяц финансового года для заданной даты.
FunctionDesc.fiscalWeek=Возвращает неделю финансового года для заданной даты.
FunctionDesc.fiscalDay=Возвращает день финансового года для заданной даты.
FunctionDesc.firstDayOfFiscalYear=Возвращает первый день финансового года, в который попадает дата.
FunctionDesc.firstDayOfFiscalQuarter=Возвращает первый день финансового квартала, в который попадает дата.
FunctionDesc.firstDayOfFiscalMonth=Возвращает первый день финансового месяца, в который попадает дата.
FunctionDesc.firstDayOfFiscalWeek=Возвращает первый день финансовой недели, в который попадает дата.
FunctionDesc.ddb=Амортизация актива за заданный одиночный период методом двойного уменьшения остатка.
FunctionDesc.fv=Будущая стоимость аннуитета на основе периодических постоянных платежей и неизменной процентной ставки.
FunctionDesc.ipmt=Процентный платёж за заданный период аннуитета,\nна основе периодических постоянных платежей и неизменной процентной ставки.
FunctionDesc.irr=Внутренняя норма доходности для серии периодических денежных потоков, платежей и поступлений, в существующем массиве.
FunctionDesc.mirr=Модифицированная норма доходности для серии периодических денежных потоков (платежей и поступлений) в существующем массиве.
FunctionDesc.nper=Количество периодов для аннуитета на основе периодических постоянных платежей и неизменной процентной ставки.
FunctionDesc.npv=Чистая приведённая стоимость изменяющейся серии периодических денежных потоков, как положительных, так и отрицательных, при заданной процентной ставке.
FunctionDesc.percent=Вычисляет процент от двух чисел.
FunctionDesc.pmt=Платёж по аннуитету на основе периодических постоянных платежей и неизменной процентной ставки.
FunctionDesc.ppmt=Платёж в счёт основной суммы долга за заданный период аннуитета на основе процентной ставки и графика постоянных платежей.
FunctionDesc.pv=Текущая стоимость аннуитета на основе периодических постоянных платежей, которые будут выплачены в будущем, и неизменной процентной ставки.
FunctionDesc.rate=Процентная ставка за период для аннуитета.
FunctionDesc.sln=Линейная амортизация актива за одиночный период.
FunctionDesc.syd=Амортизация актива методом суммы чисел лет срока полезного использования за указанный период.
FunctionDesc.addDate=Возвращает дату, полученную добавлением лет, месяцев и дней к начальной дате.
FunctionDesc.addTime=Возвращает дату, полученную добавлением часов, минут и секунд к начальной дате.
FunctionDesc.subDate=Возвращает дату, полученную вычитанием лет, месяцев и дней из начальной даты.
FunctionDesc.subTime=Возвращает дату, полученную вычитанием часов, минут и секунд из начальной даты.
FunctionDesc.days=Количество дней между двумя датами.
FunctionDesc.hours=Количество часов между двумя датами.
FunctionDesc.minutes=Количество минут между двумя датами.
FunctionDesc.months=Количество месяцев между двумя датами.
FunctionDesc.seconds=Количество секунд между двумя датами.
FunctionDesc.years=Количество лет между двумя датами.
FunctionDesc.date= Возвращает объект Date, инициализированный заданными годом, месяцем, днём, часами, минутами и секундами.\n(year, month, day обязательны; hours, minutes, seconds необязательны)
FunctionDesc.duration.year=Получает значение поля YEARS как целое число,* или 0, если поле отсутствует.\nlexicalDuration — строковое представление длительности вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)
FunctionDesc.duration.month=Получает значение поля MONTHS как целое число,* или 0, если поле отсутствует.\nlexicalDuration — строковое представление длительности вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)
FunctionDesc.duration.day=Получает значение поля DAYS как целое число,* или 0, если поле отсутствует.\nlexicalDuration — строковое представление длительности вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)
FunctionDesc.duration.hour=Получает значение поля HOURS как целое число,* или 0, если поле отсутствует.\nlexicalDuration — строковое представление длительности вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)
FunctionDesc.duration.minute=Получает значение поля MINUTES как целое число,* или 0, если поле отсутствует.\nlexicalDuration — строковое представление длительности вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)
FunctionDesc.duration.second=Получает значение поля SECONDS как целое число,* или 0, если поле отсутствует.\nlexicalDuration — строковое представление длительности вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)
FunctionDesc.duration.timeInMills=Возвращает длительность в миллисекундах.\nlexicalDuration — строковое представление вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)\nАргумент startDate используется для разрешения неоднозначности этого варианта
FunctionDesc.duration.isLongerThan=Проверяет, строго ли дольше lexicalDuration1, чем lexicalDuration2.\nНапример, "P1D" (один день) > "PT12H" (12 часов) и "P2Y" (два года) > "P23M" (23 месяца)
FunctionDesc.duration.isShorterThan=Проверяет, строго ли короче lexicalDuration1, чем lexicalDuration2.\nНапример, "PT12H" (12 часов) < "P1D" (один день).

FunctionDesc.duration.add=Вычисляет новую длительность, значение которой равно lexicalDuration1+lexicalDuration2.\nlexicalDuration — строковое представление вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)
FunctionDesc.duration.substract=Вычисляет новую длительность, значение которой равно lexicalDuration1-lexicalDuration2.\nlexicalDuration — строковое представление вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)
FunctionDesc.duration.multiply=Вычисляет новую длительность, значение которой в factor раз больше значения lexicalDuration.\nlexicalDuration — строковое представление вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)\nFactor — коэффициент, во сколько раз новая длительность больше исходной
FunctionDesc.duration.negate=Возвращает новый объект Duration, значение которого равно -lexicalDuration.\nlexicalDuration — строковое представление вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)
FunctionDesc.duration.getSign=Возвращает знак этой длительности: -1, 0 или 1.\nlexicalDuration — строковое представление вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)
FunctionDesc.duration.compare=Отношение частичного порядка между lexicalDuration1 и lexicalDuration2.\nlexicalDuration — строковое представление вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)
FunctionDesc.duration.addTo=Добавляет эту длительность к объекту Date.\nlexicalDuration — строковое представление вида "PnYnMnDTnHnMnS" (например, P5Y2M15DT4H40M20S)\nПереданный аргумент Date используется для модификации

FunctionDesc.format=Получает отформатированную строку из заданного объекта и шаблона.

extension.name = Функции скриптов BIRT
Bundle-Vendor = Проект Eclipse BIRT