odajdbc.CannotGetConnMetaData=Не удалось получить метаданные соединения.
odajdbc.CannotGetConn=Не удалось установить соединение.
odajdbc.ConnRollbackError=Ошибка отката транзакции соединения.

odajdbc.GetConnectionError=Ошибка при получении соединения: {0}.

