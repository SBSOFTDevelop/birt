#Reporting Feature Examples descriptions / Описания примеров функций отчётности

#XML Data Source / Источник данных XML
XMLDS_After=Простой отчёт, демонстрирующий использование источников данных XML. 

#Libraries / Библиотеки
Newsfeeds=Этот пример демонстрирует, как BIRT можно использовать для создания библиотек повторно используемых компонентов отчётов. В этом примере мы начинаем с создания библиотеки. Мы используем URI к RSS-ленте новостей Eclipse в качестве источника данных для отчёта и сохраняем его в библиотеке. Затем мы публикуем библиотеку в папке ресурсов. Этот пример демонстрирует создание невизуальных элементов в библиотеке. Важно отметить, что визуальные элементы также могут быть созданы и сохранены в библиотеке. 
Newsfeeds_After=Этот пример демонстрирует, как BIRT можно использовать для создания библиотек повторно используемых компонентов отчётов. В этом примере мы начинаем с создания библиотеки. Мы используем URI к RSS-ленте новостей Eclipse в качестве источника данных для отчёта и сохраняем его в библиотеке. Затем мы публикуем библиотеку в папке ресурсов. Этот пример демонстрирует создание невизуальных элементов в библиотеке. Важно отметить, что визуальные элементы также могут быть созданы и сохранены в библиотеке.

#Combination Chart / Комбинированная диаграмма
CustomerOrdersFinal=Этот пример демонстрирует, как можно создать комбинированную диаграмму в BIRT. Кроме того, этот пример также демонстрирует, как добавить drill-to-details, используя внутренние закладки и редактор интерактивности диаграмм. Комбинированная диаграмма представляет непогашенную задолженность для 5 лучших клиентов в формате столбчатой диаграммы с линейной серией, представляющей кредитный лимит каждого клиента, наложенной поверх. Столбцы внутри диаграммы затем связаны с деталями заказов для каждого клиента. 

#Cascading / Вложенные параметры
cascade=Этот пример демонстрирует, как создать отчёт BIRT, который использует вложенную группу параметров. Вложенная группа параметров позволяет связывать группу параметров между собой, где выбор значения для первого параметра влияет на доступные варианты в последующих параметрах. Вложенные параметры могут быть привязаны к одному или нескольким наборам данных. Наборы данных заполняют каждый уровень вложенности. В сочетании с параметрами набора данных это обеспечивает очень хорошую гибкость для отбора возвращаемых данных для отчёта.

#Drill to details / Детализация по клику
MasterDetailOneReport=Этот пример иллюстрирует создание отчёта с основной и детальной информацией в одном отчёте.
OrderMasterAfter=Этот пример демонстрирует создание основного отчёта и детального отчёта. Основной отчёт перечисляет заказы и позволяет пользователю отчёта щёлкнуть по определённому номеру заказа для перехода в детальный отчёт для выбранного заказа. Этот пример иллюстрирует использование простого параметра для отбора результатов в детальном отчёте и свойства гиперссылки в основном отчёте для передачи этого параметра в детальный отчёт. Свойство гиперссылки в основном отчёте генерируется динамически на основе результатов, полученных из запроса.
OrderDetailAfter=Детальный отчёт, в который осуществляется переход при щелчке по основному отчёту.

#Dynamic Report Parameter / Динамический параметр отчёта
ParameterToDataSetParameter=Этот пример иллюстрирует связывание параметра отчёта с параметром набора данных.

#Expressions / Выражения
Expressions=Этот пример демонстрирует, как создать отчёт BIRT, который использует функции.

#Grouping / Группировка
CustomerListAfter_Grouping=Этот пример демонстрирует создание сгруппированного отчёта в BIRT. Пример отчёта показывает список клиентов и группирует их по странам. Ключевые функции BIRT, которые охватываются в этой демонстрации: группировка, разрывы страниц, оглавление и агрегация данных по группе или в целом. 

#Highlighting and Conditional Formatting / Выделение и условное форматирование
ProductListAfter=Этот пример демонстрирует, как добавить выделение и условное форматирование в отчёт BIRT. Разрабатывается отчёт списка продукции, который отображает все товары компании. Пример отчёта использует чередующиеся цвета строк и выделяет строки, представляющие товар с низким количеством. Этот отчёт также иллюстрирует добавление скрипта к событию onCreate строки для изменения стиля строки на курсив для товаров с высокими значениями наценки. 

#Mapping and Sorting / Сопоставление и сортировка
CustomerListAfter_Mapping=Этот пример демонстрирует использование функций сопоставления и сортировки BIRT. Сопоставление позволяет элементу отчёта BIRT отображать другое значение на основе выражения. Например, если запрос возвращает числовое поле для месяца (1-12), функция сопоставления может быть использована для отображения Январь — Декабрь. В этом примере мы используем сопоставление для отображения кредитного рейтинга для клиентов Classic Models. Сортировка используется во многих местах в BIRT и очень гибка. В этом примере мы демонстрируем добавление выражения сортировки к элементу таблицы, который привязан к параметру отчёта. Параметр позволяет ввести поисковую строку, которая затем используется в выражении сортировки для установки порядка сортировки таблицы. 

#Parallel Report / Параллельный отчёт
EmployeeAfter=Этот пример демонстрирует, как создать отчёт с параллельными секциями. Он также иллюстрирует использование фильтров таблицы для отбора отображаемых данных. Отчёт использует элемент сетки для макета двух столбцов. В каждом столбце добавляется набор вложенных таблиц для получения информации о сотрудниках и группировки по иерархии должностей. Таблицы фильтруются по коду офиса. 

#Query Modification / Модификация запроса
NullParameter=Этот пример демонстрирует, как модифицировать запрос на основе параметров отчёта, используя события набора данных. В качестве примера запрос модифицируется, если для параметра отчёта предоставлено значение. 
OrderDetailsAfter=Этот пример демонстрирует, как модифицировать JDBC-запрос, используя привязку свойств или скрипт. Привязка свойств — это функция в BIRT, которая позволяет модифицировать общедоступные свойства источника данных и набора данных во время выполнения. Это может быть полезно для добавления контекстно-зависимой информации к любому из элементов. В качестве примера предложение WHERE может быть модифицировано для получения имени пользователя из сессии, или URL базы данных может быть переключён между разработкой и производством на основе параметра отчёта. 

#Report Elements / Элементы отчёта
ProductLinesAfter=Этот пример демонстрирует использование элементов Label, Text, Dynamic Text, Data и Image в дизайне отчёта. Также определяются некоторые ключевые особенности и различия между элементами. Этот пример также иллюстрирует получение данных BLOB и CLOB из источника данных. 

#Sub Report / Подотчёт
OrdersAfter=Этот пример демонстрирует создание отчёта, который использует вложенные таблицы. Запрос, привязанный к внутренней таблице, параметризован для возврата деталей заказа для данного номера заказа во внешней таблице. Этот пример также иллюстрирует ссылку на столбцы внешней таблицы внутри вложенной таблицы. Это позволяет проектировать отчёты BIRT с основной и детальной информацией, содержащейся в одном отчёте. По мере обработки строк внешней таблицы запрос внутренней таблицы выполняется повторно на основе информации из внешней таблицы. 

#Sorting / Сортировка
SortTableByReportParameter=Этот пример демонстрирует создание отчёта, который использует вложенные таблицы. Запрос, привязанный к внутренней таблице, параметризован для возврата деталей заказа для данного номера заказа во внешней таблице. Этот пример также иллюстрирует ссылку на столбцы внешней таблицы внутри вложенной таблицы. Это позволяет проектировать отчёты BIRT с основной и детальной информацией, содержащейся в одном отчёте. По мере обработки строк внешней таблицы запрос внутренней таблицы выполняется повторно на основе информации из внешней таблицы. 

#Cross tab / Перекрёстная таблица
CrosstabSampleRevenue=Этот пример демонстрирует создание простого отчёта с элементом отчёта перекрёстной таблицы (который основан на кубе BIRT). Он создаёт перекрёстную таблицу с линейкой продукции в области столбцов и год->квартал в области строк.
