#Scripting / Скриптинг

#Dynamic Map Rule / Динамическое правило сопоставления
DynamicMapRule=Этот пример иллюстрирует вызов API Design Engine внутри скрипта beforeFactory для добавления правила сопоставления к элементу отчёта.  

#Group Separator / Разделитель группы
GroupSeparator=Этот пример иллюстрирует добавление разделителя каждые 3 строки внутри группы. Этот счётчик сбрасывается при разрыве страницы.  

#Retrieve Session Information / Получение информации о сессии
Application_Session_IntegrationBF=Этот пример иллюстрирует использование JavaScript для получения информации из сессии.

#Scripted Data Source / Скриптовый источник данных
ScriptedDatasourceExampleAfter=Этот раздел примеров посвящён скриптингу в BIRT. Для иллюстрации функций скриптинга используются простые отчёты. Большинство примеров будут иметь отчёты до и после, которые можно загрузить. Чтобы загрузить экспортированный Java-объект и позволить отчёту его использовать, пожалуйста, перезапустите BIRT после открытия этого примера отчёта.  

#Visibility Rule / Правило видимости
Addvisrule=Этот пример иллюстрирует добавление правила видимости в скрипт.  

#Chart / Диаграмма
SimpleChartAPI=Этот пример иллюстрирует многие из доступных методов JavaScript в простом API диаграмм. Они вызываются из обработчика событий beforeFactory отчёта.

###########################################################
#Extending BIRT / Расширение BIRT

#Aggreate function extension point / Точка расширения агрегатной функции
optim=Этот раздел примеров посвящён расширению BIRT. Примеры здесь сосредоточены на реализации поставляемых BIRT точек расширения, предоставляя разработчику BIRT возможность добавлять или изменять поведение по умолчанию дизайнера или движка времени выполнения. Это включает добавление типов диаграмм, агрегатных функций, источников данных и элементов отчёта. 