#Solution reports descriptions / Описания примеров отчётов

#Listing / Списки
ProductCatalog=Печатает каталог продукции Classic Models, сгруппированный по категориям товаров. Предоставляет название товара, стоимость и описание. Демонстрирует группировку одного уровня и использование сетки внутри строки таблицы для структурирования интервалов. Также показывает включение изображений и использование тега <value-of> в текстовом элементе для включения содержимого столбца базы данных. Наконец, отчёт использует стили для упрощения сопровождения и достижения единообразного внешнего вида. 
TopSellingProducts=Отображает круговую диаграмму, показывающую доход по линейке продукции. Перечисляет самые продаваемые товары, отсортированные по доходу. Демонстрирует использование диаграммы и сортировку набора результатов. Также показывает включение изображений и использование сетки и таблиц для организации содержимого отчёта. Наконец, отчёт использует стили для упрощения сопровождения и достижения единообразного внешнего вида. 
TopNPercent=Используя возможности фильтрации top n и top percent, добавленные в BIRT 2.0, этот отчёт показывает столбчатую диаграмму с N лучшими клиентами по доходу, за которой следует список M% лучших клиентов по доходу, отсортированных по имени клиента. Это требует нескольких проходов по данным, но всё это делается "под капотом" движком отчётов BIRT. N и M передаются в отчёт как параметры, чтобы позволить пользователям отчёта выбирать количество и процент во время выполнения. 
StaticCrosstab=Этот пример иллюстрирует создание статического отчёта перекрёстной таблицы с использованием функции BIRT Total. Отчёт представляет годовой доход от продаж по кварталам для каждой из линеек продукции, которые в настоящее время продаёт Classic Models Inc. Кроме того, итоги агрегируются по горизонтальным и вертикальным измерениям. Функция BIRT Total может принимать второй параметр, который фильтрует агрегированные данные. В этом примере эта функция используется для отображения только значений, относящихся к предложению продукта, например, Поезда. Первый параметр в функции Total — это значение для агрегации, и в этом примере он установлен как количество проданных единиц, умноженное на цену за единицу. Второй параметр — это фильтр. Так, если фильтр указан как dataSetRow["Products::PRODUCTLINE"]=="Motorcycles", будет агрегирована только линейка продукции Мотоциклы. 

#Business Forms / Бизнес-формы
SalesInvoice=Печатает счёт для выбранного заказа, включая данные клиента и счёта, а также заказанные товары. Демонстрирует использование параметра для выбора заказа для счёта и выражений для нескольких вычисляемых полей, включая скидку и итоговую сумму заказа. Использует выражение для построения строки адреса клиента и иллюстрирует подавление null-значений в полях базы данных с помощью JavaScript-функции replace. Также показывает включение изображений и сложное использование сеток и таблиц для организации содержимого отчёта. Наконец, отчёт использует стили для упрощения сопровождения и достижения единообразного внешнего вида. 

