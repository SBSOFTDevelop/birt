#Contribute Samples / Внести примеры
Contribute_Samples=Пожалуйста, отправьте запись в Bugzilla по адресу https://bugs.eclipse.org/bugs/enter_bug.cgi?product=BIRT&bug_severity=enhancement, приложив файл дизайна отчёта и скриншот вывода отчёта (в формате изображения .png, разрешение 800*600, не более 250 КБ)

