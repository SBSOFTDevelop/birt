# Описание параметра
OptionDescription.AgentStyleEngine=True: эмиттер HTML выводит стили BIRT напрямую в отчет и полагается на браузер для выполнения расчётов стилей.\nFalse: эмиттер HTML использует движок стилей BIRT для расчёта стилей и выводит результат в отчет.
OptionDescription.OutputMasterPageMargins=Выводить поля мастер-страницы для отчета с автоматическим макетом.
OptionDescription.MasterPageContent=Содержит заголовок и футер страницы, действует только если включена пагинация.
OptionDescription.PageFooterFloat=Плавающий футер страницы, действует только если включена пагинация.
OptionDescription.HTMLType=Тип HTML.