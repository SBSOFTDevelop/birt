###########################################################
# Эмиттер PDF
PDFEmitter.Description=Настройка параметров для рендеринга отчета в формате PDF (Portable Document Format).
PDFEmitter.DisplayName=PDF

###########################################################
# Отображаемое значение параметра
OptionDisplayValue.BidiProcessing=Обработка BIDI (двунаправленный текст)
OptionDisplayValue.TextWrapping=Перенос текста
OptionDisplayValue.TextWordbreak=Перенос слов
OptionDisplayValue.PageOverFlow=Обработка переполнения страницы
OptionDisplayValue.CLIP_CONTENT=Обрезать содержимое
OptionDisplayValue.FIT_TO_PAGE_SIZE=Подогнать под размер страницы
OptionDisplayValue.OUTPUT_TO_MULTIPLE_PAGES=Вывод на несколько страниц
OptionDisplayValue.ENLARGE_PAGE_SIZE=Увеличить размер страницы
OptionDisplayValue.FontSubstitution=Подстановка шрифтов
OptionDisplayValue.EmbeddedFont=Встроенный шрифт
OptionDisplayValue.ChartDpi=DPI диаграммы
OptionDisplayValue.RenderChartInSVG=Рендеринг диаграммы в векторной графике
OptionDisplayValue.RepaginateForPDF=Переразбивка страниц при рендеринге PDF
OptionDisplayValue.DisableFlashAnimation=Отключить анимацию Flash для печати
OptionDisplayValue.DisablePrint=Отключить печать

###########################################################
# Описание параметра
OptionDescription.BidiProcessing=Поддерживает двунаправленный текст.
OptionDescription.TextHyphenation=Поддерживает перенос слов по слогам.
OptionDescription.TextWrapping=Определяет, разрешён ли перенос текста.
OptionDescription.PageOverFlow=Управляет способом вывода содержимого.
OptionDescription.FontSubstitution=Автоматически подбирает шрифты, если указанный шрифт не поддерживает отображение символа.
OptionDescription.EmbeddedFont=Шрифт TrueType будет встроен в сгенерированный PDF-файл.
OptionDescription.ChartDpi=DPI, используемый для генерации диаграммы.
OptionDescription.RenderChartInSVG=Рендеринг диаграммы в векторной графике.
OptionDescription.RepaginateForPDF=Выполняет переразбивку страниц при рендеринге PDF.
OptionDescription.DisableFlashAnimation=Отключает анимацию Flash при печати.
OptionDescription.DisablePrint=Отключает печать.

###########################################################
# Подсказка
Tooltip.ChartDpi=DPI, который движок диаграмм использует для генерации диаграмм. Например, 192.