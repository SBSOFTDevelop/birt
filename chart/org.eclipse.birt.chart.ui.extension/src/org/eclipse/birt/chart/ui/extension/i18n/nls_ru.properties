MeterChart.Txt.HelpText=Индикаторные диаграммы показывают текущее значение данных определённого измерения. Области разных цветов представляют диапазоны значений измерений. Стрелка связана с циферблатом и показывает его значение.
MeterChart.Txt.Description=Стандартные индикаторные диаграммы содержат один циферблат с областью(ями).
Фон циферблата может быть разделён на области разных цветов.
MeterChart.Txt.SuperimposedDescription=Наложенные индикаторные диаграммы содержат несколько циферблатов с идентичными областями.
Циферблаты накладываются друг на друга, так что могут представлять несколько стрелок в пределах одной области.
