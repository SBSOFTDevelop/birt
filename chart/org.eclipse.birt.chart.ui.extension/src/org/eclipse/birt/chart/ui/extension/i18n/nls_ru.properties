StockChart.Txt.BarStickDescription=Биржевая диаграмма типа «стержень» содержит вертикальную линию с двумя горизонтальными линиями, прикреплёнными к ней.
Верхняя и нижняя точки вертикальной линии — значения открытия и закрытия акции.
Две горизонтальные линии — максимальное и минимальное значения.
StockChart.Txt.CandleStickDescription=Биржевая диаграмма типа «свеча» содержит прямоугольник с линиями, extending вверх и вниз от концов.
Верхний и нижний края прямоугольника — значения открытия и закрытия акции.
Верхняя и нижняя точки линии — максимальное и минимальное значения.
StockChart.Txt.HelpText=Биржевые диаграммы представляют графические элементы, где каждый элемент представляет одну торговую сессию. Верхний конец линии указывает максимальное значение сессии. Нижний конец линии указывает минимальное значение сессии. Столбец соединяет значения открытия и закрытия.
