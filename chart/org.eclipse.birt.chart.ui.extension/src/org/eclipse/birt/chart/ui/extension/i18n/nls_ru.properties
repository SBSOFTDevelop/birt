AreaChart.Txt.PercentStackedDescription=Процентные стекированные/Area-диаграммы показывают области, стекированные одна над другой так,
что общая высота стекированных областей (от нижней точки до верхней в каждой единице) составляет 100.
AreaChart.Txt.StackedDescription=Стекированные/Area-диаграммы показывают области, стекированные одна над другой.
Положительные и отрицательные значения стекируются отдельно выше и ниже начала координат.
AreaChart.Txt.OverlayDescription=Наложение/Area-диаграммы показывают области из каждой серии независимо от других.
Области отображаются, соединяя значения для серии.
AreaChart.Txt.HelpText=Каждая отображаемая серия представлена областью. Опциональные маркеры могут использоваться для выделения точек, для которых отображаются данные. Стекированные области показывают каждую точку категории относительно позиции точки данных серии области ниже неё. Стекированные процентные области показывают каждое значение данных, отображаемое как процент от общего для категории.
